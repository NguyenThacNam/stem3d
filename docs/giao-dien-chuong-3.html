/* ---------- Quy ước thiết kế (mục 3.2.1) ---------- */
:root{
  --bg:#f5f5f3; --surface:#fff; --surface-2:#efefec; --surface-3:#e7e8e4;
  --line:rgba(26,28,27,.09); --line-2:rgba(26,28,27,.16);
  --text:#1a1c1b; --text-2:#545957; --muted:#858a87;
  --accent:#0e7a55; --accent-ink:#0b6446; --accent-weak:#e6f2ec;
  --danger:#b42318; --danger-weak:#fcecea; --warn:#8a5300; --warn-weak:#fdf3dc;
  --grid:rgba(76,92,160,.07); --grid-2:rgba(76,92,160,.13);
  --r-ctl:8px; --r-card:12px; --r-panel:16px;
  --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"BVP",system-ui,sans-serif;background:#dcddd8;color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.page{padding:48px 0 80px;display:flex;flex-direction:column;align-items:center;gap:56px}
.page-head{width:1440px}
.page-head h1{font-size:22px;font-weight:500}
.page-head p{color:var(--text-2);margin-top:4px}
figure{display:flex;flex-direction:column;gap:12px}
figcaption{font-size:14px;color:var(--text-2)}
figcaption b{color:var(--text);font-weight:500}
.screen{width:1440px;height:900px;background:var(--bg);overflow:hidden;position:relative;display:flex;
  border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 32px rgba(0,0,0,.08)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}

/* ---------- Thanh bên ---------- */
.side{width:248px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.mark{width:28px;height:28px;border-radius:7px;background:var(--accent);position:relative;flex:none;
  background-image:linear-gradient(rgba(255,255,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.28) 1px,transparent 1px);background-size:7px 7px;background-position:3px 3px}
.brand .n{font-weight:500;font-size:14px;line-height:1.2}
.brand .s{font-size:12px;color:var(--muted)}
.nav-label{font-size:12px;color:var(--muted);padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-ctl);color:var(--text-2);text-decoration:none;margin-bottom:2px}
.nav a.on{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.nav a .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;font-size:12px;font-weight:500;flex:none}
.me .who{line-height:1.3;min-width:0}
.me .who b{display:block;font-weight:500;font-size:13px}
.me .who span{font-size:12px;color:var(--muted)}
.me svg{margin-left:auto;color:var(--muted)}

/* ---------- Vùng nội dung ---------- */
.main{flex:1;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;gap:16px}
.head h2{font-size:22px;font-weight:500;line-height:1.3}
.head .sub{color:var(--text-2);font-size:13px;margin-top:2px}
.head .act{margin-left:auto;display:flex;gap:8px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:4px}

.btn{height:40px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--surface);color:var(--text);
  font:inherit;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.input{height:40px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text)}
.input.ph{color:var(--muted)}
.input .tail{margin-left:auto;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg span{height:32px;padding:0 14px;border-radius:7px;display:flex;align-items:center;color:var(--text-2);font-size:13px}
.seg span.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06),inset 0 0 0 1px var(--line);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;background:var(--surface-2);color:var(--text-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--accent)} .dot.warn{background:#d18a00} .dot.bad{background:var(--danger)}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)} .t2{color:var(--text-2)}

table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;height:36px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
td{height:44px;padding:0 16px;border-bottom:1px solid var(--line);font-size:13px}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
tr.sel td{background:var(--accent-weak)}

/* ---------- Khung 3D: nền lưới ô li ---------- */
.grid3d{background-color:#f7f7f5;
  background-image:linear-gradient(var(--grid-2) 1px,transparent 1px),linear-gradient(90deg,var(--grid-2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:64px 64px,64px 64px,16px 16px,16px 16px;background-position:-1px -1px}
.model{position:absolute;display:block}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(30,32,30,.18),rgba(30,32,30,0))}

/* Thanh trên của khung bài học */
.lbar{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px}
.lbar .t{font-weight:500;font-size:15px;line-height:1.25}
.lbar .t span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.lbar .mid{position:absolute;left:50%;transform:translateX(-50%)}
.lbar .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--text-2);border:1px solid var(--line-2);background:var(--surface)}
.callout{position:absolute;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.06);white-space:nowrap}
.callout small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.callout.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.leader{position:absolute;height:1px;background:var(--text-2);transform-origin:0 0}
.pin{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--text-2);transform:translate(-50%,-50%)}
.pin.on{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px rgba(14,122,85,.18)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:13px}
.alert.bad{background:var(--danger-weak);color:#7a1a12}
.alert.warn{background:var(--warn-weak);color:var(--warn)}
.alert.ok{background:var(--accent-weak);color:var(--accent-ink)}
.alert svg{margin-top:1px}

.scrim{position:absolute;inset:0;background:rgba(24,26,25,.32)}
.dialog{position:absolute;background:var(--surface);border-radius:var(--r-panel);box-shadow:0 24px 64px rgba(0,0,0,.18);padding:24px}
.dialog h3{font-size:18px;font-weight:500}
.dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;background:var(--surface)}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;background:var(--surface)}
.radio.on{border:5px solid var(--accent)}
</style>
</head>

/* ---------- Đồ thị chuẩn độ: tính đúng theo công thức HCl + NaOH ---------- */
const Ca = 0.1, Va = 20, Cb = 0.1, VNOW = 20.1;
const pH = vb => {
  const nA = Ca * Va, nB = Cb * vb, V = (Va + vb) / 1000;
  if (Math.abs(nA - nB) < 1e-9) return 7;
  if (nA > nB) return -Math.log10((nA - nB) / 1000 / V);
  return 14 + Math.log10((nB - nA) / 1000 / V);
};
(function curve() {
  const svg = document.getElementById('curve'), W = 900, H = 380, L = 44, R = 16, T = 30, B = 36;
  const x = v => L + (v / 30) * (W - L - R), y = p => T + (1 - p / 14) * (H - T - B);
  let g = '';
  for (let v = 0; v <= 30; v += 1) g += `<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H - B}" stroke="${v % 5 ? 'rgba(76,92,160,.06)' : 'rgba(76,92,160,.13)'}"/>`;
  for (let p = 0; p <= 14; p += 0.5) g += `<line x1="${L}" x2="${W - R}" y1="${y(p)}" y2="${y(p)}" stroke="${p % 2 ? 'rgba(76,92,160,.06)' : 'rgba(76,92,160,.13)'}"/>`;
  for (let v = 0; v <= 30; v += 5) g += `<text x="${x(v)}" y="${H - 14}" text-anchor="middle" font-size="12" fill="#858a87" font-family="Consolas,monospace">${v}</text>`;
  for (let p = 0; p <= 14; p += 2) g += `<text x="${L - 10}" y="${y(p) + 4}" text-anchor="end" font-size="12" fill="#858a87" font-family="Consolas,monospace">${p}</text>`;
  g += `<text x="${W - R}" y="${H - 14}" text-anchor="end" font-size="12" fill="#858a87" dx="0" dy="0"></text>`;
  g += `<text x="${x(30)}" y="${H - 1}" text-anchor="end" font-size="12" fill="#858a87">V NaOH (mL)</text>`;
  g += `<text x="${L - 10}" y="12" text-anchor="end" font-size="12" fill="#858a87">pH</text>`;
  // vùng đổi màu phenolphtalein 8,2 – 10
  g += `<rect x="${L}" y="${y(10)}" width="${W - L - R}" height="${y(8.2) - y(10)}" fill="rgba(214,51,132,.07)"/>`;
  g += `<text x="${W - R - 6}" y="${y(10) + 15}" text-anchor="end" font-size="12" fill="#a8326c">Khoảng đổi màu phenolphtalein</text>`;
  // đường tương đương
  g += `<line x1="${x(20)}" x2="${x(20)}" y1="${T}" y2="${H - B}" stroke="#545957" stroke-dasharray="4 4"/>`;
  g += `<text x="${x(20) + 8}" y="${T + 16}" font-size="12" fill="#545957">Điểm tương đương · 20,0 mL · pH 7</text>`;
  // đường cong đã vẽ (tới VNOW) và phần chưa làm (mờ)
  const pts = [];
  for (let v = 0; v <= VNOW + 1e-9; v += 0.02) pts.push([x(v), y(pH(v))]);
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
  g += `<path d="${d}" fill="none" stroke="#0e7a55" stroke-width="2.5" stroke-linejoin="round"/>`;
  // số liệu đã đo
  for (const v of [0, 5, 10, 15, 18, 19, 19.5, 19.9, 20.1]) g += `<circle cx="${x(v)}" cy="${y(pH(v))}" r="4" fill="#fff" stroke="#0e7a55" stroke-width="2"/>`;
  g += `<circle cx="${x(VNOW)}" cy="${y(pH(VNOW))}" r="6" fill="#0e7a55"/>`;
  svg.innerHTML = g;
})();

/* ---------- Bộ dụng cụ chuẩn độ (buret + bình tam giác) ---------- */
(function rig() {
  const s = document.getElementById('rig');
  const vRead = VNOW;            // mL đã nhỏ
  const top = 96, bot = 520, cx = 220;

    <linearGradient id="naoh" x1="0" x2="1"><stop offset="0" stop-color="#d9eef8"/><stop offset="1" stop-color="#b9dbee"/></linearGradient>
    <linearGradient id="pink" x1="0" x2="1"><stop offset="0" stop-color="#f6c3dc"/><stop offset=".5" stop-color="#eea4c8"/><stop offset="1" stop-color="#e48ab7"/></linearGradient>
    <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#9aa3a0"/><stop offset=".5" stop-color="#e3e7e5"/><stop offset="1" stop-color="#8a928f"/></linearGradient>
  </defs>`;
  // giá đỡ
  g += `<rect x="70" y="780" width="300" height="16" rx="4" fill="url(#metal)"/>`;
  g += `<rect x="96" y="60" width="10" height="722" rx="3" fill="url(#metal)"/>`;
  g += `<rect x="100" y="300" width="${cx - 100 - 12}" height="8" rx="3" fill="url(#metal)"/>`;
  g += `<rect x="${cx - 18}" y="294" width="36" height="20" rx="4" fill="#6d7572"/>`;
  // buret
  g += `<rect x="${cx - 12}" y="${lvl}" width="24" height="${bot - lvl}" fill="url(#naoh)"/>`;
  g += `<rect x="${cx - 12}" y="${top}" width="24" height="${bot - top}" rx="4" fill="url(#glass)" stroke="#9aa6ad" stroke-width="1.2"/>`;
  for (let m = 0; m <= 50; m += 1) {
    const yy = top + 22 + (m / 50) * (bot - top - 22), big = m % 5 === 0;
    g += `<line x1="${cx - 12}" x2="${cx - 12 + (big ? 10 : 5)}" y1="${yy}" y2="${yy}" stroke="#5f6b70" stroke-width="${big ? 1 : .6}"/>`;
    if (m % 10 === 0) g += `<text x="${cx + 18}" y="${yy + 4}" font-size="11" fill="#5f6b70" font-family="Consolas,monospace">${m}</text>`;
  }
  g += `<path d="M${cx - 12} ${lvl} q12 4 24 0" fill="none" stroke="#5a8fb0" stroke-width="1.4"/>`;
  // khóa và đầu buret
  g += `<rect x="${cx - 7}" y="${bot}" width="14" height="22" fill="url(#glass)" stroke="#9aa6ad"/>`;
  g += `<rect x="${cx - 26}" y="${bot + 6}" width="52" height="10" rx="5" fill="#0e7a55"/>`;
  g += `<path d="M${cx - 5} ${bot + 22} L${cx - 2} ${bot + 62} L${cx + 2} ${bot + 62} L${cx + 5} ${bot + 22}Z" fill="url(#glass)" stroke="#9aa6ad"/>`;
  g += `<path d="M${cx} ${bot + 70} c-3 5 -3 9 0 9 c3 0 3 -4 0 -9z" fill="#b9dbee" stroke="#7fb3d0" stroke-width=".8"/>`;
  // bình tam giác
  const fy = 640, fb = 776;
  g += `<path d="M${cx - 16} ${fy} L${cx - 16} ${fy + 40} L${cx - 78} ${fb - 8} Q${cx - 80} ${fb} ${cx - 70} ${fb} L${cx + 70} ${fb} Q${cx + 80} ${fb} ${cx + 78} ${fb - 8} L${cx + 16} ${fy + 40} L${cx + 16} ${fy}Z" fill="url(#glass)" stroke="#9aa6ad" stroke-width="1.2"/>`;
  g += `<path d="M${cx - 58} ${fb - 52} L${cx + 58} ${fb - 52} L${cx + 77} ${fb - 9} Q${cx + 79} ${fb - 1} ${cx + 70} ${fb - 1} L${cx - 70} ${fb - 1} Q${cx - 79} ${fb - 1} ${cx - 77} ${fb - 9}Z" fill="url(#pink)" opacity=".92"/>`;
  g += `<ellipse cx="${cx}" cy="${fb - 52}" rx="58" ry="4" fill="#f3b6d4" opacity=".8"/>`;
  g += `<rect x="${cx - 18}" y="${fy - 6}" width="36" height="8" rx="3" fill="url(#glass)" stroke="#9aa6ad"/>`;
  // ghi chú
  const note = (x, y, t, s) => `<text x="${x}" y="${y}" font-size="13" fill="#1a1c1b" font-weight="500">${t}</text><text x="${x}" y="${y + 18}" font-size="12" fill="#858a87">${s}</text>`;
  g += `<line x1="${cx + 40}" x2="${cx + 70}" y1="${top + 60}" y2="${top + 60}" stroke="#858a87"/>` + note(cx + 76, top + 56, 'Buret NaOH', 'C = 0,10 mol/L');
  g += `<line x1="${cx + 82}" x2="${cx + 100}" y1="${fb - 30}" y2="${fb - 30}" stroke="#858a87"/>` + note(cx + 104, fb - 46, 'HCl 20,0 mL', '+ phenolphtalein');
  g += `<text x="24" y="36" font-size="12" fill="#858a87">Chất chỉ thị đã chuyển hồng nhạt</text>`;
  s.innerHTML = g;
})();

(function mini() {
  const svg = document.getElementById('mini-curve'), x = v => 10 + v / 30 * 200, y = p => 100 - p / 14 * 90;
