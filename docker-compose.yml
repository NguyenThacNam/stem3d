# Stem3D – 3 dịch vụ: web (Nginx), api (FastAPI), db (PostgreSQL).
# Bản chạy thật: docker compose -f docker-compose.yml up -d --build
# (không có -f thì Docker tự nạp thêm docker-compose.override.yml dành cho máy phát triển).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Không mở cổng ra ngoài: api nối vào db qua mạng nội bộ của compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # File mô hình GLB (CONTENT_DIR mặc định /data/content): api ghi khi nạp / xóa mô hình.
      - content:/data/content
    # Không mở cổng ra ngoài: mọi yêu cầu đi qua web (Nginx) tại /api/.

  web:
    # Build frontend (Vite) rồi Nginx phục vụ bản build; context là thư mục gốc để lấy cả frontend/ và nginx/.
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Cùng volume với api nhưng chỉ đọc: Nginx phục vụ file GLB tại /content/models/.
      - content:/srv/content:ro
    depends_on:
      - api

volumes:
  pgdata:
  # File mô hình 3D gốc (docs/chuong-2 mục triển khai: "volume content"). Cần sao lưu cùng pgdata (VH03).
  content:
