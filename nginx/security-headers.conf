# Header bảo mật dùng chung – include trong MỌI location có add_header riêng
# (add_header trong location ghi đè, không kế thừa, header khai báo ở server).
# "always": gửi cả với phản hồi lỗi (4xx, 5xx).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# style-src 'unsafe-inline': React đặt style trực tiếp trên phần tử (style={...}); không có script inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
