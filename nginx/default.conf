# Chọn giá trị header Connection cho WebSocket (phòng lớp học).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Mô hình GLB tối đa 150 MB (docs/quyet-dinh.md). Để 151m vì gói multipart có thêm vài KB;
    # API tải mô hình tự kiểm tra chính xác "file > 150 MB".
    client_max_body_size 151m;
    error_page 413 = @qua_lon;

    location @qua_lon {
        default_type "application/json; charset=utf-8";
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"File vượt quá 150 MB, hãy chọn file nhỏ hơn","details":null}}';
    }

    # X-Forwarded-For = $remote_addr (ghi đè, không nối thêm): máy khách không giả được IP ghi vào nhật ký.
    # Nếu sau này đặt sau proxy/CDN thì dùng set_real_ip_from cho đúng dải của proxy đó.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket phòng lớp học: /ws/class/{class_id} (chương 3, mục 3.1.6).
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
