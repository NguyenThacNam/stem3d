# Chọn giá trị header Connection cho WebSocket (phòng lớp học).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Nén phản hồi chữ (JS, CSS, JSON): mạng trường thường chậm. Ảnh, font woff2, GLB đã nén sẵn.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Mô hình GLB tối đa 150 MB (docs/quyet-dinh.md). Để 151m vì gói multipart có thêm vài KB;
    # API tải mô hình tự kiểm tra chính xác "file > 150 MB".
    client_max_body_size 151m;
    error_page 413 = @qua_lon;

    location @qua_lon {
        include /etc/nginx/snippets/security-headers.conf;
        default_type "application/json; charset=utf-8";
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"File vượt quá 150 MB, hãy chọn file nhỏ hơn","details":null}}';
    }

    # X-Forwarded-For = $remote_addr (GHI ĐÈ, không nối thêm bằng $proxy_add_x_forwarded_for): uvicorn chạy
    # --forwarded-allow-ips * lấy địa chỉ ngoài cùng bên trái, nên nếu nối thêm thì máy khách giả được IP ghi
    # vào nhật ký. Nếu sau này đặt sau proxy/CDN thì dùng set_real_ip_from cho đúng dải của proxy đó.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket phòng lớp học: /ws/class/{class_id} (chương 3, mục 3.1.6).
    location /ws/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Bản build frontend (Vite). File trong /assets/ có mã băm trong tên: lưu đệm lâu dài.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Ứng dụng một trang: đường dẫn lạ trả index.html; index.html luôn hỏi lại máy chủ để nhận bản mới.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
